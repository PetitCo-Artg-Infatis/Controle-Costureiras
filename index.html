<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Petit & Co. · Controle de Produção</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --cream:#F6F0E4;
    --cream-dark:#EDE3CF;
    --brown:#7A5A42;
    --brown-dark:#5C4230;
    --brown-light:#B79A80;
    --orange:#E8935D;
    --orange-dark:#D97840;
    --white:#FFFFFF;
    --text:#4A382A;
    --red:#C56A5A;
    --green:#7A9E6B;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--cream); }
  body{
    font-family:'Nunito', ui-rounded, system-ui, sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .font-display{ font-family:'Baloo 2','Nunito', ui-rounded, system-ui, sans-serif; }
  input, select, textarea, button{ font-family:inherit; font-size:16px; }
  button{ cursor:pointer; border:none; background:none; }
  ::-webkit-scrollbar{ width:0px; }

  #shell{
    width:100%;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    box-shadow:0 0 40px rgba(90,66,48,0.12);
    display:flex;
    flex-direction:column;
    transition:max-width .2s ease;
  }
  #shell.wide{ max-width:760px; }

  .app-header{
    padding:16px 16px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:20;
    background:var(--cream);
    border-bottom:2px solid var(--cream-dark);
  }
  .brand-mark{ width:36px; height:36px; object-fit:contain; display:block; flex-shrink:0; }
  .brand-text{ flex:1; min-width:0; }
  .brand-title{ font-size:18px; font-weight:800; line-height:1; color:var(--brown-dark); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-title .accent{ color:var(--orange); }
  .brand-sub{ font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--brown-light); margin:2px 0 0; }
  .back-btn{ padding:8px; margin-left:-8px; border-radius:999px; color:var(--brown-dark); display:flex; flex-shrink:0; }

  .main{ flex:1; padding:20px 16px 40px; }
  .intro-text{ font-size:14px; line-height:1.4; color:var(--brown-dark); margin:0 0 16px; }

  .card{ background:var(--white); border:1px solid var(--cream-dark); border-radius:18px; padding:16px; }
  .form-card{ margin-bottom:16px; }

  .field{ display:block; margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field-label{ display:block; font-size:14px; font-weight:700; color:var(--brown-dark); margin-bottom:6px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .input{ width:100%; border:1.5px solid var(--brown-light); border-radius:12px; padding:10px 12px; outline:none; color:var(--text); background:var(--white); }
  .input:focus{ border-color:var(--orange); }
  .input-sm{ padding:7px 8px; border-radius:9px; font-size:13px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; font-weight:800; font-size:14px; padding:12px 18px; transition:transform .1s ease; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; pointer-events:none; }
  .btn-block{ width:100%; }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-outline{ background:var(--white); color:var(--brown-dark); border:1.5px solid var(--brown-light); }
  .btn-ghost{ background:var(--cream); color:var(--brown); }

  .icon-btn{ padding:8px; border-radius:999px; background:var(--cream); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }

  .section-label{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--brown-light); margin:0 0 8px; }

  .footer{ text-align:center; padding:16px; font-size:11px; color:var(--brown-light); user-select:none; cursor:pointer; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); z-index:60; padding:10px 18px; border-radius:999px; background:var(--brown-dark); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; bottom:calc(24px + env(safe-area-inset-bottom)); box-shadow:0 8px 20px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90%; }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast .undo-link{ text-decoration:underline; font-weight:800; margin-left:4px; cursor:pointer; color:#FFD9BD; white-space:nowrap; }

  .modal-overlay{ position:fixed; inset:0; z-index:50; background:rgba(74,56,42,.5); display:flex; align-items:flex-end; justify-content:center; padding:0; }
  @media (min-width:520px){ .modal-overlay{ align-items:center; } }
  .modal{ width:100%; max-width:420px; background:var(--white); padding:20px; border-radius:24px 24px 0 0; max-height:90vh; overflow-y:auto; }
  @media (min-width:520px){ .modal{ border-radius:24px; } }
  .modal.cream{ background:var(--cream); }
  .modal-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .modal-title{ font-size:16px; font-weight:800; color:var(--brown-dark); margin:0; }
  .modal-text{ font-size:14px; font-weight:600; color:var(--brown-dark); margin:0 0 16px; }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions .btn{ flex:1; }

  /* PIN */
  .pin-view{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; }
  .pin-icon-wrap{ background:var(--cream-dark); border-radius:999px; padding:16px; margin-bottom:16px; }
  .pin-title{ font-size:17px; font-weight:800; color:var(--brown-dark); margin:0 0 4px; }
  .pin-sub{ font-size:12px; color:var(--brown-light); text-align:center; margin:0 0 24px; max-width:240px; }
  .pin-input{ width:160px; text-align:center; font-size:26px; letter-spacing:.5em; padding:12px; border-radius:14px; border:1.5px solid var(--brown-light); outline:none; margin-bottom:16px; }
  .pin-input.error{ border-color:var(--red); animation:shake .35s; }
  .pin-enter{ width:160px; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* Admin */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .stat-card{ border-radius:16px; padding:12px; background:var(--white); border:1px solid var(--cream-dark); }
  .stat-card.dark{ background:var(--brown); border:none; }
  .stat-label{ font-size:10px; font-weight:800; margin:6px 0 0; color:var(--brown-light); }
  .stat-card.dark .stat-label{ color:#F0D9C4; }
  .stat-value{ font-size:14px; font-weight:800; color:var(--brown-dark); margin:0; }
  .stat-card.dark .stat-value{ color:#fff; }

  .month-picker{ position:relative; flex-shrink:0; }
  .month-trigger{ display:flex; align-items:center; gap:4px; border:1.5px solid var(--brown-light); border-radius:10px; padding:7px 10px; font-size:12px; font-weight:800; color:var(--brown-dark); background:var(--white); white-space:nowrap; }
  .month-popover{ position:absolute; top:calc(100% + 6px); right:0; background:var(--white); border:1px solid var(--cream-dark); border-radius:14px; padding:12px; box-shadow:0 10px 30px rgba(90,66,42,.22); z-index:45; width:190px; display:none; }
  .month-popover.open{ display:block; }
  .month-popover select{ width:100%; margin-bottom:8px; border:1.5px solid var(--brown-light); border-radius:10px; padding:8px; font-size:14px; color:var(--text); background:var(--white); }
  .month-popover .btn{ width:100%; }

  .action-row{ display:flex; gap:8px; margin-bottom:16px; }
  .action-row .btn{ flex:1; }

  .banner{ border-radius:16px; padding:12px; margin-bottom:16px; background:#FBEFD9; border:1px solid var(--orange); }
  .banner-title{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--orange-dark); margin:0 0 8px; }
  .banner-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; font-size:12px; color:var(--brown-dark); }
  .banner-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .banner-actions{ display:flex; gap:6px; flex-shrink:0; }
  .banner-actions button{ padding:5px 10px; border-radius:999px; font-weight:800; font-size:11px; }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; gap:8px; color:var(--brown-light); }

  .msg-card{ margin-bottom:16px; }
  .msg-select{ margin-bottom:10px; }
  .msg-preview{ width:100%; min-height:140px; border:1.5px solid var(--brown-light); border-radius:12px; padding:10px; font-size:12px; background:var(--cream); color:var(--text); resize:vertical; outline:none; }
  .msg-actions{ display:flex; gap:8px; margin-top:10px; }
  .msg-actions .btn{ flex:1; }
  .msg-empty{ font-size:13px; color:var(--brown-light); }

  .charts-section{ margin-bottom:16px; }
  .chart-card{ background:var(--white); border:1px solid var(--cream-dark); border-radius:16px; padding:14px; margin-bottom:12px; }
  .chart-title{ font-size:13px; font-weight:800; color:var(--brown-dark); margin:0 0 10px; }
  .chart-box{ position:relative; height:210px; }
  .chart-unavailable{ font-size:12px; color:var(--brown-light); text-align:center; padding:30px 0; }

  .seam-list{ display:flex; flex-direction:column; gap:12px; }
  .seam-card{ background:var(--white); border:1px solid var(--cream-dark); border-radius:18px; overflow:hidden; }
  .seam-head{ display:flex; align-items:center; gap:6px; padding:12px; }
  .seam-name-btn{ flex:1; min-width:0; display:flex; align-items:center; gap:6px; text-align:left; }
  .seam-name{ font-size:14px; font-weight:800; color:var(--brown-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seam-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .seam-total-btn{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .seam-total{ font-size:14px; font-weight:800; color:var(--orange-dark); }
  .seam-detail{ display:none; padding:0 12px 12px; border-top:1px dashed var(--cream-dark); }
  .seam-card.open .seam-detail{ display:block; }
  .seam-card.open .chev-down{ display:none; }
  .seam-card:not(.open) .chev-up{ display:none; }

  .entry-row{ padding:10px 0; border-bottom:1px dashed var(--cream-dark); display:flex; flex-direction:column; gap:6px; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-top{ display:flex; align-items:center; gap:8px; }
  .entry-bottom{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .entry-select{ flex:1; min-width:0; }
  .entry-x{ font-size:11px; color:var(--brown-light); }
  .entry-subtotal{ margin-left:auto; font-size:13px; font-weight:800; color:var(--brown-dark); }
  .w-16{ width:64px; }
  .w-20{ width:80px; }
</style>
</head>

<div id="shell"><div id="app"></div></div>
<div id="toast" class="toast"></div>

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function toBRL(n){
  if (isNaN(n) || !isFinite(n)) return "R$ 0,00";
  return n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentMonthKey(){ return new Date().toISOString().slice(0,7); }
function monthKeyOf(dateStr){ return (dateStr||"").slice(0,7); }
function formatMonthLabel(monthKey){
  const parts = monthKey.split("-").map(Number);
  const y = parts[0], m = parts[1];
  if (!y || !m) return monthKey;
  return MONTHS_PT[m-1] + " de " + y;
}
function formatMonthShort(monthKey){
  const parts = monthKey.split("-");
  const y = parts[0], m = Number(parts[1]);
  if(!y || !m) return monthKey;
  return MONTHS_PT_SHORT[m-1] + "/" + y.slice(2);
}
function formatDateBR(dateStr){
  if (!dateStr) return "";
  const p = dateStr.split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function normalize(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," ");
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}
function similarity(a,b){
  const na=normalize(a), nb=normalize(b);
  if(!na || !nb) return 0;
  if(na===nb) return 1;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length, nb.length) || 1;
  return 1 - dist/maxLen;
}
function bestMatch(list, rawName){
  let best = { sim:0, item:null };
  for(const item of list){
    let sim = similarity(rawName, item.name);
    for(const alias of (item.aliases||[])) sim = Math.max(sim, similarity(rawName, alias));
    if(sim > best.sim) best = { sim, item };
  }
  return best;
}
function matchOrCreate(list, rawName){
  const name = (rawName||"").trim();
  const best = bestMatch(list, name);
  if(best.sim >= AUTO_MERGE_THRESHOLD && best.item){
    const item = best.item;
    let aliases = item.aliases || [];
    if(normalize(name) !== normalize(item.name) && !aliases.some(a=>normalize(a)===normalize(name))){
      aliases = aliases.concat([name]);
    }
    const newList = list.map(it => it.id===item.id ? Object.assign({}, it, { aliases }) : it);
    return { list:newList, id:item.id, isNew:false };
  }
  const newItem = { id:uid(), name, aliases:[] };
  const suggestion = (best.sim >= REVIEW_THRESHOLD && best.item) ? best.item.id : null;
  return { list: list.concat([newItem]), id:newItem.id, isNew:true, suggestion };
}
function priceKey(seamstressId, productId){ return seamstressId + "__" + productId; }

function downloadCSV(filename, header, rows){
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const lines = [header.map(esc).join(";")].concat(rows.map(r=>r.map(esc).join(";")));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  triggerDownload(blob, filename);
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; } catch(e){ return false; }
}

}

function refreshDatalists(){
  const sList = document.getElementById('seamstress-names');
  const pList = document.getElementById('product-names');
  if(sList) sList.innerHTML = state.data.seamstresses.map(s=>'<option value="'+escapeHtml(s.name)+'">').join('');
  if(pList) pList.innerHTML = state.data.products.map(p=>'<option value="'+escapeHtml(p.name)+'">').join('');
}

function attachRealtimeListener(){
  docRef.onSnapshot(function(doc){
    state.data = normalizeData(doc.exists ? doc.data() : null);
    const wasLoading = state.loading;
    state.loading = false;
    if(wasLoading){ renderApp(); return; }
    if(state.view === 'admin'){ renderApp(); }
    else if(state.view === 'form'){ refreshDatalists(); }
  }, function(err){
    console.error('Erro de conexão com o Firestore', err);
    state.connectionError = true;
    state.loading = false;
    renderApp();
  });
}

async function persist(next){
  state.data = next;
  try{
    await docRef.set(next);
  }catch(e){
    console.error("Falha ao salvar", e);
    showToast('Não foi possível salvar. Verifique a internet.');
  }
}

function showToast(msg, opts){
  opts = opts || {};
  const t = $('#toast');
  let html = icon('checkCircle',16) + ' <span>' + escapeHtml(msg) + '</span>';
  if(opts.actionLabel) html += '<span class="undo-link" id="toast-action">'+escapeHtml(opts.actionLabel)+'</span>';
  t.innerHTML = html;
  t.classList.add('show');
  if(opts.actionLabel && opts.onAction){
    $('#toast-action', t).addEventListener('click', ()=>{
      opts.onAction();
      t.classList.remove('show');
      clearTimeout(showToast._t);
    });
  }
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), opts.duration || 2200);
}

async function onSubmitCostureira(){
  const nameInput = $('#cst-name'), productInput = $('#cst-product'), qtyInput = $('#cst-qty'), dateInput = $('#cst-date');
  const name = nameInput.value.trim();
  const product = productInput.value.trim();
  const qty = Number(qtyInput.value);
  const date = dateInput.value || todayISO();
  if(!name || !product || !qty || qty<=0) return;
  const btn = $('#cst-submit');
  btn.disabled = true;
  const sResult = matchOrCreate(state.data.seamstresses, name);
  const pResult = matchOrCreate(state.data.products, product);
  const entry = {
    id: uid(), seamstressId: sResult.id, productId: pResult.id,
    rawSeamstressName: name, rawProductName: product, quantity: qty, date,
    createdAt: new Date().toISOString(),
    seamstressSuggestion: sResult.suggestion || null,
    productSuggestion: pResult.suggestion || null,
  };
  const next = Object.assign({}, state.data, {
    seamstresses: sResult.list, products: pResult.list, entries: state.data.entries.concat([entry]),
  });
  await persist(next);
  productInput.value = '';
  qtyInput.value = '';
  btn.disabled = false;
  showToast('Registrado, '+name.split(' ')[0]+'!', {
    actionLabel: 'Desfazer',
    duration: 6000,
    onAction: ()=>removeEntrySilently(entry.id),
  });
}

async function removeEntrySilently(id){
  const next = Object.assign({}, state.data, { entries: state.data.entries.filter(e=>e.id!==id) });
  await persist(next);
  showToast('Removido.');
}

/* ================= PAINEL ADMINISTRATIVO ================= */
function computeAdminModel(){
  const month = state.month;
  const entriesOfMonth = state.data.entries.filter(e => monthKeyOf(e.date) === month);
  const bySeamstress = new Map();
  entriesOfMonth.forEach(e=>{
    if(!bySeamstress.has(e.seamstressId)) bySeamstress.set(e.seamstressId, []);
    bySeamstress.get(e.seamstressId).push(e);
  });
  const seamstresses = state.data.seamstresses
    .filter(s => bySeamstress.has(s.id))
    .map(s=>{
      const entries = bySeamstress.get(s.id).slice().sort((a,b)=> a.date < b.date ? 1 : -1);
      let total=0, pieces=0;
      entries.forEach(e=>{
        const price = state.data.prices[priceKey(s.id, e.productId)] || 0;
        total += price * e.quantity;
        pieces += e.quantity;
      });
      return Object.assign({}, s, { entries, total, pieces });
    })
    .sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR'));
  const totalPay = seamstresses.reduce((s,x)=>s+x.total, 0);
  const totalPieces = entriesOfMonth.reduce((s,e)=>s+e.quantity, 0);
  return { seamstresses, totalPay, totalPieces, activeSeamstresses: seamstresses.length };
}

function computeMergeSuggestions(){
  const seen = new Set();
  const list = [];
  state.data.entries.forEach(e=>{
    if(e.seamstressSuggestion && e.seamstressId !== e.seamstressSuggestion){
      const key = [e.seamstressId, e.seamstressSuggestion].sort().join('|');
      if(!seen.has(key)){
        seen.add(key);
        const a = state.data.seamstresses.find(s=>s.id===e.seamstressId);
        const b = state.data.seamstresses.find(s=>s.id===e.seamstressSuggestion);
        if(a && b) list.push({ kind:'seamstress', aId:a.id, bId:b.id, aName:a.name, bName:b.name });
      }
    }
    if(e.productSuggestion && e.productId !== e.productSuggestion){
      const key = ['p', e.productId, e.productSuggestion].sort().join('|');
      if(!seen.has(key)){
        seen.add(key);
        const a = state.data.products.find(p=>p.id===e.productId);
        const b = state.data.products.find(p=>p.id===e.productSuggestion);
        if(a && b) list.push({ kind:'product', aId:a.id, bId:b.id, aName:a.name, bName:b.name });
      }
    }
  });
  return list;
}

  });

  $all('.edit-name-btn').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      startEditName(btn.dataset.id);
    });
  });

  $all('.delete-seam-btn').forEach(btn=>btn.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    state.confirmDeleteSeamstress = btn.dataset.id;
    renderApp();
  }));

  $all('.wa-quick-btn').forEach(btn=>btn.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    quickOpenWhatsApp(btn.dataset.id);
  }));

  $all('.delete-entry-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    state.confirmDeleteEntry = btn.dataset.entryId; renderApp();
  }));
  if(state.confirmDeleteEntry){
    $('#cancel-delete').addEventListener('click', ()=>{ state.confirmDeleteEntry=null; renderApp(); });
    $('#confirm-delete').addEventListener('click', ()=>deleteEntry(state.confirmDeleteEntry));
  }
  if(state.confirmDeleteSeamstress){
    $('#cancel-delete-seam').addEventListener('click', ()=>{ state.confirmDeleteSeamstress=null; renderApp(); });
    $('#confirm-delete-seam').addEventListener('click', deleteSeamstress);
  }

  $all('.entry-product').forEach(sel=>sel.addEventListener('change', ()=>{
    updateEntry(sel.dataset.entryId, { productId: sel.value });
  }));
  $all('.entry-date').forEach(inp=>inp.addEventListener('change', ()=>{
    updateEntry(inp.dataset.entryId, { date: inp.value });
  }));
  $all('.entry-qty').forEach(inp=>inp.addEventListener('change', ()=>{
    updateEntry(inp.dataset.entryId, { quantity: Number(inp.value)||0 });
  }));
  $all('.entry-price').forEach(inp=>inp.addEventListener('change', ()=>{
    setPrice(inp.dataset.seamId, inp.dataset.productId, inp.value);
  }));

  $all('.merge-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    mergeSuggestion(computeMergeSuggestions()[Number(btn.dataset.idx)]);
  }));
  $all('.dismiss-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    dismissSuggestion(computeMergeSuggestions()[Number(btn.dataset.idx)]);
  }));

  $('#open-manual').addEventListener('click', ()=>{ state.manualOpen=true; renderApp(); });
  if(state.manualOpen){
    $('#close-manual').addEventListener('click', ()=>{ state.manualOpen=false; renderApp(); });
    $('#save-manual').addEventListener('click', saveManualEntry);
  }
  $('#export-sheet').addEventListener('click', exportSpreadsheet);

  const msgSelect = $('#msg-select');
  if(msgSelect){
    msgSelect.addEventListener('change', (e)=>{ state.msgSelectedSeamstressId = e.target.value; renderApp(); });
    $('#msg-copy').addEventListener('click', async ()=>{
      const ok = await copyText($('#msg-preview').value);
      showToast(ok ? 'Mensagem copiada!' : 'Não foi possível copiar.');
    });
    $('#msg-whatsapp').addEventListener('click', ()=>{
      const text = $('#msg-preview').value;
      window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank');
    });
  }

  if(state.waModal){
    $('#close-wa').addEventListener('click', ()=>{ state.waModal=null; renderApp(); });
  }
}

function startEditName(id){
  const card = $('.seam-card[data-seam-id="'+id+'"]');
  const btn = $('.seam-name-btn[data-id="'+id+'"]', card);
  const seamstress = state.data.seamstresses.find(s=>s.id===id);
  if(!seamstress) return;
  btn.innerHTML = '<input class="input input-sm" id="rename-input" style="flex:1;min-width:0;" value="'+escapeHtml(seamstress.name)+'" />';
  const input = $('#rename-input', btn);
  input.focus();
  input.select();
  const commit = async ()=>{
    const val = input.value.trim();
    if(val){
      const next = Object.assign({}, state.data, {
        seamstresses: state.data.seamstresses.map(s=> s.id===id ? Object.assign({}, s, { name: val }) : s)
      });
      await persist(next);
    }
    renderApp();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
  input.addEventListener('click', e=>e.stopPropagation());
}

async function updateEntry(entryId, patch){
  const next = Object.assign({}, state.data, {
    entries: state.data.entries.map(e => e.id===entryId ? Object.assign({}, e, patch) : e)
  });
  await persist(next);
  renderApp();
}

async function deleteEntry(entryId){
  const next = Object.assign({}, state.data, { entries: state.data.entries.filter(e=>e.id!==entryId) });
  await persist(next);
  state.confirmDeleteEntry = null;
  renderApp();
  showToast('Registro removido.');
}

async function deleteSeamstress(){
  const id = state.confirmDeleteSeamstress;
  if(!id) return;
  const next = Object.assign({}, state.data);
  next.seamstresses = state.data.seamstresses.filter(s=>s.id!==id);
  next.entries = state.data.entries.filter(e=>e.seamstressId!==id);
  const newPrices = {};
  Object.keys(state.data.prices).forEach(k=>{ if(k.indexOf(id+'__')!==0) newPrices[k]=state.data.prices[k]; });
  next.prices = newPrices;
  await persist(next);
  state.confirmDeleteSeamstress = null;
  state.expandedIds.delete(id);
  if(state.msgSelectedSeamstressId===id) state.msgSelectedSeamstressId = null;
  renderApp();
  showToast('Costureira removida.');
}

async function setPrice(seamId, productId, value){
  const next = Object.assign({}, state.data, {
    prices: Object.assign({}, state.data.prices, { [priceKey(seamId, productId)]: Number(value)||0 })
  });
  await persist(next);
  renderApp();
}

async function dismissSuggestion(sug){
  if(!sug) return;
  const field = sug.kind==='seamstress' ? 'seamstressSuggestion' : 'productSuggestion';
  const idField = sug.kind==='seamstress' ? 'seamstressId' : 'productId';
  const next = Object.assign({}, state.data, {
    entries: state.data.entries.map(e => (e[idField]===sug.aId && e[field]===sug.bId) ? Object.assign({}, e, { [field]: null }) : e)
  });
  await persist(next);
  renderApp();
}

async function mergeSuggestion(sug){
  if(!sug) return;
  const idField = sug.kind==='seamstress' ? 'seamstressId' : 'productId';
  const listField = sug.kind==='seamstress' ? 'seamstresses' : 'products';
  const winner = state.data[listField].find(x=>x.id===sug.bId);
  const loser = state.data[listField].find(x=>x.id===sug.aId);
  if(!winner || !loser) return;
  const aliases = Array.from(new Set([].concat(winner.aliases||[], [loser.name], loser.aliases||[])));
  const newList = state.data[listField].filter(x=>x.id!==loser.id).map(x=> x.id===winner.id ? Object.assign({}, x, { aliases }) : x);
  const sugField = sug.kind==='seamstress' ? 'seamstressSuggestion' : 'productSuggestion';
  const newEntries = state.data.entries.map(e=>{
    let ne = Object.assign({}, e);
    if(ne[idField]===loser.id) ne[idField]=winner.id;
    if(ne[sugField]===loser.id || ne[sugField]===winner.id) ne[sugField]=null;
    return ne;
  });
  let newPrices = Object.assign({}, state.data.prices);
  Object.keys(newPrices).forEach(k=>{
    if(sug.kind==='seamstress' && k.indexOf(loser.id+'__')===0){
      const pid = k.split('__')[1];
      const wKey = priceKey(winner.id, pid);
      if(newPrices[wKey]===undefined) newPrices[wKey]=newPrices[k];
      delete newPrices[k];
    } else if(sug.kind==='product' && k.endsWith('__'+loser.id)){
      const sid = k.split('__')[0];
      const wKey = priceKey(sid, winner.id);
      if(newPrices[wKey]===undefined) newPrices[wKey]=newPrices[k];
      delete newPrices[k];
    }
  });
  const next = Object.assign({}, state.data);
  next[listField] = newList;
  next.entries = newEntries;
  next.prices = newPrices;
  await persist(next);
  renderApp();
  showToast('Mesclado com sucesso.');
}

function buildWhatsAppMessage(s){
  const grouped = new Map();
  s.entries.forEach(e=>{
    grouped.set(e.productId, (grouped.get(e.productId)||0) + e.quantity);
  });
  let lines = ['Oi, '+s.name.split(' ')[0]+'! Segue o fechamento de '+formatMonthLabel(state.month)+':', ''];
  grouped.forEach((qty, pid)=>{
    const price = state.data.prices[priceKey(s.id, pid)] || 0;
    lines.push('- '+qty+'x '+productName(pid)+' = '+toBRL(price*qty));
  });
  lines.push('', 'Total: '+toBRL(s.total), '', 'Qualquer dúvida me chama! Petit & Co.');
  return lines.join('\n');
}

async function quickOpenWhatsApp(seamId){
  const model = computeAdminModel();
  const s = model.seamstresses.find(x=>x.id===seamId);
  if(!s) return;
  const text = buildWhatsAppMessage(s);
  window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank');
}

async function saveManualEntry(){
  const name = $('#man-name').value.trim();
  const product = $('#man-product').value.trim();
  const qty = Number($('#man-qty').value);
  const date = $('#man-date').value || todayISO();
  if(!name || !product || !qty) return;
  const sResult = matchOrCreate(state.data.seamstresses, name);
  const pResult = matchOrCreate(state.data.products, product);
  const entry = {
    id: uid(), seamstressId: sResult.id, productId: pResult.id,
    rawSeamstressName: name, rawProductName: product, quantity: qty, date,
    createdAt: new Date().toISOString(),
    seamstressSuggestion: sResult.suggestion || null,
    productSuggestion: pResult.suggestion || null,
  };
  const next = Object.assign({}, state.data, {
    seamstresses: sResult.list, products: pResult.list, entries: state.data.entries.concat([entry]),
  });
  await persist(next);
  state.manualOpen = false;
  renderApp();
}

/* ================= GRÁFICOS ================= */
function renderCharts(){
  const boxSeam = document.getElementById('chart-by-seamstress');
  const boxMonth = document.getElementById('chart-by-month');
  if(!boxSeam || !boxMonth) return;

  Object.keys(chartInstances).forEach(k=>{ try{ chartInstances[k].destroy(); }catch(e){} });
  chartInstances = {};

  if(typeof Chart === 'undefined'){
    boxSeam.closest('.chart-box').innerHTML = '<p class="chart-unavailable">Gráficos indisponíveis no momento (sem conexão).</p>';
    boxMonth.closest('.chart-box').innerHTML = '<p class="chart-unavailable">Gráficos indisponíveis no momento (sem conexão).</p>';
    return;
  }

  const model = computeAdminModel();
  const sortedBySeam = model.seamstresses.slice().sort((a,b)=>b.pieces-a.pieces);
  chartInstances.bySeam = new Chart(boxSeam.getContext('2d'), {
    type:'bar',
    data:{
      labels: sortedBySeam.map(s=>s.name),
      datasets:[{ label:'Peças produzidas', data: sortedBySeam.map(s=>s.pieces), backgroundColor:'#E8935D', borderRadius:8, maxBarThickness:38 }]
    },
    options:{
      plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } },
      responsive:true, maintainAspectRatio:false
    }
  });

  const year = state.month.split('-')[0];
  const seamstressIdsThisYear = new Set();
  state.data.entries.forEach(e=>{ if(e.date && e.date.indexOf(year+'-')===0) seamstressIdsThisYear.add(e.seamstressId); });
  const series = Array.from(seamstressIdsThisYear).map((id,idx)=>{
    const s = state.data.seamstresses.find(x=>x.id===id);
    const monthly = new Array(12).fill(0);
    state.data.entries.forEach(e=>{
      if(e.seamstressId===id && e.date && e.date.indexOf(year+'-')===0){
        const mi = Number(e.date.slice(5,7))-1;
        if(mi>=0 && mi<12) monthly[mi]+=e.quantity;
      }
    });
    return { name: s? s.name : '?', data: monthly, color: PALETTE[idx % PALETTE.length] };
  }).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

  chartInstances.byMonth = new Chart(boxMonth.getContext('2d'), {
    type:'line',
    data:{
      labels: MONTHS_PT_SHORT.map(m=>capitalize(m)),
      datasets: series.map(s=>({
        label: s.name, data: s.data, borderColor: s.color, backgroundColor: s.color,
        tension:0.35, pointRadius:3, borderWidth:2, fill:false
      }))
    },
    options:{
      plugins:{ legend:{ display: series.length>0, position:'bottom', labels:{ boxWidth:10, font:{ size:10 } } } },
      scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } },
      responsive:true, maintainAspectRatio:false
    }
  });
}

/* ================= EXPORTAR PLANILHA ================= */
function exportCSVFallback(model){
  const rows = [];
  model.seamstresses.forEach(s=>{
    s.entries.forEach(e=>{
      const price = state.data.prices[priceKey(s.id, e.productId)] || 0;
      rows.push([s.name, productName(e.productId), e.quantity, formatDateBR(e.date), toBRL(price), toBRL(price*e.quantity)]);
    });
    rows.push([s.name + ' - TOTAL', '', '', '', '', toBRL(s.total)]);
  });
  downloadCSV('fechamento-'+state.month+'.csv', ['Costureira','Produto','Quantidade','Data','Preço/un','Subtotal'], rows);
}

async function exportSpreadsheet(){
  const model = computeAdminModel();
  if(model.seamstresses.length===0) return;

  if(typeof ExcelJS === 'undefined'){
    exportCSVFallback(model);
    showToast('Baixado em CSV (planilha estilizada indisponível).');
    return;
  }

  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Petit & Co.';
    const ws = wb.addWorksheet(formatMonthLabel(state.month).slice(0,28), { views:[{ state:'frozen', ySplit:3, showGridLines:false }] });

    ws.mergeCells('A1:F1');
    const titleCell = ws.getCell('A1');
    titleCell.value = 'Petit & Co. — Fechamento de ' + formatMonthLabel(state.month);
    titleCell.font = { name:'Calibri', size:16, bold:true, color:{ argb:'FFFFFFFF' } };
    titleCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF7A5A42' } };
    titleCell.alignment = { vertical:'middle', horizontal:'center' };
    ws.getRow(1).height = 34;

    try{
      const imgId = wb.addImage({ base64: PENGUIN_IMG, extension:'png' });
      ws.addImage(imgId, { tl:{ col:0.05, row:0.05 }, ext:{ width:34, height:34 } });
    }catch(imgErr){ /* segue sem a imagem se falhar */ }

    ws.mergeCells('A2:F2');
    const subCell = ws.getCell('A2');
    subCell.value = 'Total a pagar: ' + toBRL(model.totalPay) + '   ·   Peças produzidas: ' + model.totalPieces + '   ·   Costureiras: ' + model.activeSeamstresses;
    subCell.font = { italic:true, size:11, color:{ argb:'FF5C4230' } };
    subCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFEDE3CF' } };
    subCell.alignment = { vertical:'middle', horizontal:'center' };
    ws.getRow(2).height = 22;

    const headerRow = ws.addRow(['Costureira','Produto','Data','Quantidade','Preço/un','Subtotal']);
    headerRow.eachCell(cell=>{
      cell.font = { bold:true, color:{ argb:'FFFFFFFF' } };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFE8935D' } };
      cell.alignment = { vertical:'middle', horizontal:'center' };
    });
    headerRow.height = 20;

    ws.columns = [ { width:24 }, { width:24 }, { width:13 }, { width:13 }, { width:13 }, { width:15 } ];

    model.seamstresses.forEach((s, si)=>{
      const bandColor = si % 2 === 0 ? 'FFFFFFFF' : 'FFF6F0E4';
      s.entries.forEach(e=>{
        const price = state.data.prices[priceKey(s.id, e.productId)] || 0;
        const row = ws.addRow([ s.name, productName(e.productId), formatDateBR(e.date), e.quantity, price, price*e.quantity ]);
        row.eachCell((cell, colNum)=>{
          cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: bandColor } };
          if(colNum===5 || colNum===6) cell.numFmt = '"R$" #,##0.00';
          cell.alignment = { vertical:'middle', horizontal: colNum<=2 ? 'left' : 'center' };
        });
      });
      const totalRow = ws.addRow([ s.name + ' — total', '', '', s.pieces, '', s.total ]);
      totalRow.eachCell(cell=>{
        cell.font = { bold:true, color:{ argb:'FF5C4230' } };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFEDE3CF' } };
      });
      totalRow.getCell(6).numFmt = '"R$" #,##0.00';
    });

    const grandRow = ws.addRow(['TOTAL GERAL', '', '', model.totalPieces, '', model.totalPay]);
    grandRow.eachCell(cell=>{
      cell.font = { bold:true, size:12, color:{ argb:'FFFFFFFF' } };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF7A5A42' } };
    });
    grandRow.getCell(6).numFmt = '"R$" #,##0.00';

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    triggerDownload(blob, 'fechamento-petit-co-'+state.month+'.xlsx');
    showToast('Planilha baixada!');
  }catch(err){
    console.error('Erro ao gerar planilha estilizada, usando CSV.', err);
    exportCSVFallback(model);
    showToast('Baixado em CSV (houve um erro na planilha).');
  }
}

document.addEventListener('click', function(e){
  const pop = document.getElementById('month-popover');
  const trig = document.getElementById('month-trigger');
  if(pop && pop.classList.contains('open') && !pop.contains(e.target) && e.target!==trig && !trig.contains(e.target)){
